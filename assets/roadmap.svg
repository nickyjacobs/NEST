<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 624" width="1600" height="624" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">NEST roadmap</title>
<desc id="d">Now: bring your old notes with you, your assistant from your phone. Next: a command board on Home, what your assistant remembers is yours. Later: upkeep that runs by itself, your workspace on two computers.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121216"/><stop offset="1" stop-color="#0b0b0e"/></linearGradient>
<linearGradient id="track" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="1544" y2="0"><stop offset="0" stop-color="#f5a55a"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b93a7" stop-opacity="0.5"/></linearGradient>
<radialGradient id="glow" cx="0.12" cy="0" r="0.7"><stop offset="0" stop-color="#f5a55a" stop-opacity="0.16"/><stop offset="1" stop-color="#f5a55a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="624" rx="28" fill="url(#bg)"/>
<rect width="1600" height="624" rx="28" fill="url(#glow)"/>
<g transform="translate(56 44) scale(1.9)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 9 12 15 2 9Z"/><path d="M2 14.5 12 20.5 22 14.5"/></g>
<text x="116" y="78" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="1">NEST <tspan font-weight="400" fill="#c9c9d4">roadmap</tspan></text>
<text x="1544" y="76" text-anchor="end" fill="#8d8d9a" font-size="18">No dates. A point moves up when it is built and tried.</text>
<path d="M66 140 H1544" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>
<path d="M1530 132 l14 8 -14 8" fill="none" stroke="#8b93a7" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="66" cy="140" r="10" fill="#0e0e12" stroke="#f5a55a" stroke-width="3"/><circle cx="66" cy="140" r="4" fill="#f5a55a"/>
<text x="56" y="196" fill="#f5a55a" font-size="22" font-weight="700" letter-spacing="3">NOW</text>
<text x="137" y="196" fill="#8d8d9a" font-size="17">the next releases work on this</text>
<rect x="56" y="224" width="464" height="128" rx="18" fill="#17171d" stroke="#2a2a34"/>
<rect x="56" y="246" width="4" height="84" rx="2" fill="#f5a55a"/>
<rect x="80" y="256" width="64" height="64" rx="16" fill="#f5a55a" fill-opacity="0.13"/>
<g transform="translate(94 270) scale(1.5)" fill="none" stroke="#f5a55a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></g>
<text x="164" y="274" fill="#ffffff" font-size="21" font-weight="650">Bring your old notes with you</text>
<text x="164" y="302" fill="#a9a9b6" font-size="16">The notes you already have, moved in</text>
<text x="164" y="324" fill="#a9a9b6" font-size="16">and filed, a batch at a time.</text>
<rect x="56" y="372" width="464" height="128" rx="18" fill="#17171d" stroke="#2a2a34"/>
<rect x="56" y="394" width="4" height="84" rx="2" fill="#f5a55a"/>
<rect x="80" y="404" width="64" height="64" rx="16" fill="#f5a55a" fill-opacity="0.13"/>
<g transform="translate(94 418) scale(1.5)" fill="none" stroke="#f5a55a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></g>
<text x="164" y="422" fill="#ffffff" font-size="21" font-weight="650">Your assistant from your phone</text>
<text x="164" y="450" fill="#a9a9b6" font-size="16">Ask on the way home, or send a photo</text>
<text x="164" y="472" fill="#a9a9b6" font-size="16">and find it filed in your wiki.</text>
<circle cx="578" cy="140" r="10" fill="#0e0e12" stroke="#a78bfa" stroke-width="3"/><circle cx="578" cy="140" r="4" fill="#a78bfa"/>
<text x="568" y="196" fill="#a78bfa" font-size="22" font-weight="700" letter-spacing="3">NEXT</text>
<text x="666" y="196" fill="#8d8d9a" font-size="17">after that</text>
<rect x="568" y="224" width="464" height="128" rx="18" fill="#17171d" stroke="#2a2a34"/>
<rect x="568" y="246" width="4" height="84" rx="2" fill="#a78bfa"/>
<rect x="592" y="256" width="64" height="64" rx="16" fill="#a78bfa" fill-opacity="0.13"/>
<g transform="translate(606 270) scale(1.5)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></g>
<text x="676" y="274" fill="#ffffff" font-size="21" font-weight="650">A command board on Home</text>
<text x="676" y="302" fill="#a9a9b6" font-size="16">Today, your tasks and your routines</text>
<text x="676" y="324" fill="#a9a9b6" font-size="16">in one place, a click away.</text>
<rect x="568" y="372" width="464" height="128" rx="18" fill="#17171d" stroke="#2a2a34"/>
<rect x="568" y="394" width="4" height="84" rx="2" fill="#a78bfa"/>
<rect x="592" y="404" width="64" height="64" rx="16" fill="#a78bfa" fill-opacity="0.13"/>
<g transform="translate(606 418) scale(1.5)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></g>
<text x="676" y="422" fill="#ffffff" font-size="21" font-weight="650">What it remembers is yours</text>
<text x="676" y="450" fill="#a9a9b6" font-size="16">Its notes in your workspace, in your</text>
<text x="676" y="472" fill="#a9a9b6" font-size="16">backup and under the secret scan.</text>
<circle cx="1090" cy="140" r="10" fill="#0e0e12" stroke="#8b93a7" stroke-width="3"/><circle cx="1090" cy="140" r="4" fill="#8b93a7"/>
<text x="1080" y="196" fill="#8b93a7" font-size="22" font-weight="700" letter-spacing="3">LATER</text>
<text x="1195" y="196" fill="#8d8d9a" font-size="17">further out</text>
<rect x="1080" y="224" width="464" height="128" rx="18" fill="#17171d" stroke="#2a2a34"/>
<rect x="1080" y="246" width="4" height="84" rx="2" fill="#8b93a7"/>
<rect x="1104" y="256" width="64" height="64" rx="16" fill="#8b93a7" fill-opacity="0.13"/>
<g transform="translate(1118 270) scale(1.5)" fill="none" stroke="#8b93a7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
<text x="1188" y="274" fill="#ffffff" font-size="21" font-weight="650">Upkeep that runs by itself</text>
<text x="1188" y="302" fill="#a9a9b6" font-size="16">The weekly wiki check and your morning</text>
<text x="1188" y="324" fill="#a9a9b6" font-size="16">briefing at a set time.</text>
<rect x="1080" y="372" width="464" height="128" rx="18" fill="#17171d" stroke="#2a2a34"/>
<rect x="1080" y="394" width="4" height="84" rx="2" fill="#8b93a7"/>
<rect x="1104" y="404" width="64" height="64" rx="16" fill="#8b93a7" fill-opacity="0.13"/>
<g transform="translate(1118 418) scale(1.5)" fill="none" stroke="#8b93a7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="11" rx="2"/><path d="M2 19h20"/></g>
<text x="1188" y="422" fill="#ffffff" font-size="21" font-weight="650">Your workspace on two computers</text>
<text x="1188" y="450" fill="#a9a9b6" font-size="16">Your assistant on your other computer</text>
<text x="1188" y="472" fill="#a9a9b6" font-size="16">too, in step with the first.</text>
<path d="M56 544 H1544" stroke="#24242c"/>
<text x="56" y="584" fill="#8d8d9a" font-size="17">Every part stays a choice and reaches your workspace through <tspan fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/nest-update</tspan></text>
</svg>
