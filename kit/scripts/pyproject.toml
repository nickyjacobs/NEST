[project]
name = "nest-scripts"
version = "0.1.0"
description = "The scripts a NEST workspace runs: wiki maintenance, validation and helpers."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
