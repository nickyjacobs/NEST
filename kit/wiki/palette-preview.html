<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colours for your wiki</title>
<!--
  A preview the setup shows in the browser, so the user picks colours by eye and never from
  colour codes. The setup copies this file to _setup/preview/palette.html, replaces the three
  values marked "customise" below, opens it, and asks which option the user wants. Nothing here
  is installed: the chosen colours go into snippets/base.css, appearance.json and the Notebook
  Navigator settings in build step B2.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px 48px; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9e9ee; color: #1c1c22; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: #55555f; max-width: 60ch; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { border-radius: 14px; overflow: hidden; border: 1px solid rgba(0,0,0,.12); background: var(--bg); color: var(--fg); }
  .card.dark { --bg: #16161b; --panel: #1f1f26; --fg: #e8e8ee; --muted: #9a9aa8; --line: #2c2c36; }
  .card.light { --bg: #ffffff; --panel: #f4f4f7; --fg: #1c1c22; --muted: #6a6a76; --line: #e2e2e8; }
  .card header { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .card header strong { font-size: 22px; letter-spacing: .02em; }
  .card header span { color: var(--muted); }
  .body { display: grid; grid-template-columns: 42% 58%; min-height: 250px; }
  .side { background: var(--panel); padding: 12px 10px; border-right: 1px solid var(--line); }
  .side div { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; font-weight: 600; }
  .side i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .main { padding: 14px 16px; }
  .main h2 { margin: 0 0 8px; font-size: 17px; }
  .main a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .btn { display: inline-block; margin: 8px 6px 0 0; padding: 5px 12px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; }
  .tile { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel); border-top: 3px solid var(--accent); color: var(--muted); font-size: 13px; }
  @media (max-width: 420px) { .body { grid-template-columns: 1fr; } .side { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="grid" id="grid"></div>
<script>
// customise: the three texts below in the user's language.
const TEXT = {
  title: "Colours for your wiki",
  lead: "Each card is one option. Look at the folder colours on the left and the buttons and links on the right, then tell your assistant which letter you want.",
  sample: ["Home", "Open a note", "New note", "This is how a panel on your start page looks."]
};
// customise: two or three options. "mode" is "dark" or "light", "accent" the colour of buttons
// and links, "sections" the folders of the user's wiki with one colour each (their labels from
// C1, in order). Colours as #rrggbb.
const PALETTES = [
  { letter: "A", name: "<fill in: a name in plain words, such as Purple and pink>", mode: "dark", accent: "#8b5cf6",
    sections: [{ label: "<fill in: section label>", color: "#f472b6" }] }
];
document.getElementById("title").textContent = TEXT.title;
document.getElementById("lead").textContent = TEXT.lead;
const grid = document.getElementById("grid");
for (const p of PALETTES) {
  const card = document.createElement("section");
  card.className = "card " + (p.mode === "light" ? "light" : "dark");
  card.style.setProperty("--accent", p.accent);
  const head = document.createElement("header");
  const letter = document.createElement("strong"); letter.textContent = p.letter;
  const name = document.createElement("span"); name.textContent = p.name;
  head.append(letter, name);
  const body = document.createElement("div"); body.className = "body";
  const side = document.createElement("div"); side.className = "side";
  for (const s of p.sections) {
    const row = document.createElement("div"); row.style.color = s.color;
    const dot = document.createElement("i"); dot.style.background = s.color;
    row.append(dot, document.createTextNode(s.label));
    side.append(row);
  }
  const main = document.createElement("div"); main.className = "main";
  const h = document.createElement("h2"); h.textContent = TEXT.sample[0];
  const link = document.createElement("a"); link.href = "#"; link.textContent = TEXT.sample[1];
  const btn = document.createElement("span"); btn.className = "btn"; btn.textContent = TEXT.sample[2];
  const tile = document.createElement("div"); tile.className = "tile"; tile.textContent = TEXT.sample[3];
  main.append(h, link, document.createElement("br"), btn, tile);
  body.append(side, main);
  card.append(head, body);
  grid.append(card);
}
</script>
</body>
</html>
