name: links

on:
  push:
    paths: ['**.md']
  pull_request:
    paths: ['**.md']
  schedule:
    # Weekly, to catch links that rot over time.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # kit/ holds templates with placeholder links, so only the docs are checked. The changelog's
          # compare and release links only exist once a tag is pushed, so they are left out.
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,206,429
            --exclude 'github\.com/nickyjacobs/NEST/(compare|releases/tag)/'
            './*.md' './docs/**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
