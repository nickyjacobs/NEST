name: Feature request
description: A concrete change to the setup, a skill or the wiki you would like built
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The situation, for example "I keep losing track of ...".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: An interview question, a skill, a wiki section, an integration.
